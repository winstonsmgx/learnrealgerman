<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lexico Quiz – Động từ tiền tố tiếng Đức</title>
<style>
  :root {
    --green: #58cc02;
    --green-dark: #46a302;
    --red: #ff4b4b;
    --red-dark: #d63b3b;
    --blue: #1cb0f6;
    --blue-dark: #1899d6;
    --gray-bg: #f7f7f7;
    --gray-border: #e5e5e5;
    --text: #3c3c3c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--gray-bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 20px 12px 40px;
  }
  .app {
    width: 100%;
    max-width: 480px;
  }
  .topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
  }
  .progress-bar {
    flex: 1;
    height: 16px;
    background: var(--gray-border);
    border-radius: 999px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--green);
    border-radius: 999px;
    transition: width 0.3s ease;
    width: 0%;
  }
  .score {
    font-weight: 800;
    color: var(--green-dark);
    white-space: nowrap;
    font-size: 15px;
  }
  .errors {
    font-weight: 800;
    color: var(--red);
    white-space: nowrap;
    font-size: 15px;
  }
  .card {
    background: white;
    border-radius: 16px;
    padding: 28px 20px;
    box-shadow: 0 2px 0 var(--gray-border);
    border: 2px solid var(--gray-border);
  }
  .qnum {
    font-size: 13px;
    color: #999;
    font-weight: 700;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
    text-transform: uppercase;
  }
  .question {
    font-size: 20px;
    font-weight: 700;
    line-height: 1.4;
    margin-bottom: 24px;
  }
  .options {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .option-btn {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    text-align: left;
    padding: 14px 16px;
    font-size: 17px;
    font-weight: 600;
    border-radius: 14px;
    border: 2px solid var(--gray-border);
    border-bottom-width: 5px;
    background: white;
    color: var(--text);
    cursor: pointer;
    transition: transform 0.05s ease, background 0.15s ease, border-color 0.15s ease;
    font-family: inherit;
  }
  .option-btn .letter {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 2px solid var(--gray-border);
    font-size: 13px;
    font-weight: 800;
    color: #999;
    flex-shrink: 0;
  }
  .option-btn:active:not(:disabled) {
    transform: translateY(2px);
    border-bottom-width: 3px;
  }
  .option-btn:hover:not(:disabled) {
    background: #f0faff;
    border-color: var(--blue);
  }
  .option-btn:disabled { cursor: default; }
  .option-btn.correct {
    background: #d7ffb8;
    border-color: var(--green);
    color: var(--green-dark);
  }
  .option-btn.correct .letter {
    background: var(--green);
    border-color: var(--green);
    color: white;
  }
  .option-btn.wrong {
    background: #ffdfe0;
    border-color: var(--red);
    color: var(--red-dark);
  }
  .option-btn.wrong .letter {
    background: var(--red);
    border-color: var(--red);
    color: white;
  }
  .option-btn.dim { opacity: 0.5; }

  .feedback {
    margin-top: 20px;
    padding: 16px 18px;
    border-radius: 14px;
    display: none;
    animation: slideUp 0.2s ease;
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .feedback.show { display: block; }
  .feedback.correct-fb {
    background: #d7ffb8;
    border: 2px solid var(--green);
  }
  .feedback.wrong-fb {
    background: #ffdfe0;
    border: 2px solid var(--red);
  }
  .feedback-title {
    font-weight: 800;
    font-size: 15px;
    margin-bottom: 4px;
  }
  .correct-fb .feedback-title { color: var(--green-dark); }
  .wrong-fb .feedback-title { color: var(--red-dark); }
  .feedback-meaning {
    font-size: 15px;
    color: var(--text);
  }
  .feedback-meaning b { color: inherit; }
  .feedback-synonym {
    font-size: 15px;
    color: var(--text);
    margin-top: 4px;
  }
  .feedback-synonym b { color: inherit; }

  .continue-btn {
    margin-top: 20px;
    width: 100%;
    padding: 16px;
    font-size: 16px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    border-radius: 14px;
    border: none;
    border-bottom: 5px solid var(--green-dark);
    background: var(--green);
    color: white;
    cursor: pointer;
    display: none;
    font-family: inherit;
  }
  .continue-btn.show { display: block; }
  .continue-btn:active { transform: translateY(2px); border-bottom-width: 3px; }

  .result-screen {
    display: none;
    text-align: center;
    padding: 40px 20px;
  }
  .result-screen.show { display: block; }
  .result-emoji { font-size: 64px; margin-bottom: 12px; }
  .result-title { font-size: 24px; font-weight: 800; margin-bottom: 8px; }
  .result-stats {
    display: flex;
    justify-content: center;
    gap: 24px;
    margin: 24px 0;
  }
  .stat-box {
    background: white;
    border: 2px solid var(--gray-border);
    border-radius: 14px;
    padding: 16px 24px;
  }
  .stat-num { font-size: 28px; font-weight: 800; }
  .stat-label { font-size: 12px; color: #999; font-weight: 700; text-transform: uppercase; }
  .stat-box.correct-stat .stat-num { color: var(--green-dark); }
  .stat-box.wrong-stat .stat-num { color: var(--red); }
  .restart-btn {
    padding: 16px 32px;
    font-size: 16px;
    font-weight: 800;
    text-transform: uppercase;
    border-radius: 14px;
    border: none;
    border-bottom: 5px solid var(--blue-dark);
    background: var(--blue);
    color: white;
    cursor: pointer;
    font-family: inherit;
  }
  .restart-btn:active { transform: translateY(2px); border-bottom-width: 3px; }

  .wrong-list {
    text-align: left;
    margin-top: 24px;
    max-height: 260px;
    overflow-y: auto;
    border-top: 2px solid var(--gray-border);
    padding-top: 16px;
  }
  .wrong-item {
    background: white;
    border: 2px solid var(--gray-border);
    border-radius: 12px;
    padding: 10px 14px;
    margin-bottom: 8px;
    font-size: 14px;
  }
  .wrong-item .q-text { color: #777; margin-bottom: 4px; }
  .wrong-item .ans-text { font-weight: 700; color: var(--green-dark); }

  #quiz-screen { display: block; }
</style>
</head>
<body>
<div class="app">

  <div id="quiz-screen">
    <div class="topbar">
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <div class="score" id="scoreDisplay">✓ 0</div>
      <div class="errors" id="errorDisplay">✗ 0</div>
    </div>

    <div class="card">
      <div class="qnum" id="qnum">Câu 1 / 311</div>
      <div class="question" id="questionText"></div>
      <div class="options" id="optionsContainer"></div>

      <div class="feedback" id="feedback">
        <div class="feedback-title" id="feedbackTitle"></div>
        <div class="feedback-meaning" id="feedbackMeaning"></div>
        <div class="feedback-synonym" id="feedbackSynonym"></div>
      </div>

      <button class="continue-btn" id="continueBtn">Tiếp tục</button>
    </div>
  </div>

  <div id="result-screen" class="result-screen">
    <div class="result-emoji" id="resultEmoji">🎉</div>
    <div class="result-title" id="resultTitle">Hoàn thành!</div>
    <div class="result-stats">
      <div class="stat-box correct-stat">
        <div class="stat-num" id="finalCorrect">0</div>
        <div class="stat-label">Đúng</div>
      </div>
      <div class="stat-box wrong-stat">
        <div class="stat-num" id="finalWrong">0</div>
        <div class="stat-label">Sai</div>
      </div>
    </div>
    <button class="restart-btn" id="restartBtn">Làm lại</button>
    <div class="wrong-list" id="wrongList"></div>
  </div>

</div>

// shuffle a copy so each run has a fresh order
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

let questions = [];
let currentIndex = 0;
let correctCount = 0;
let wrongCount = 0;
let wrongAnswers = [];
let answered = false;

const quizScreen = document.getElementById('quiz-screen');
const resultScreen = document.getElementById('result-screen');
const qnumEl = document.getElementById('qnum');
const questionTextEl = document.getElementById('questionText');
const optionsContainer = document.getElementById('optionsContainer');
const feedbackEl = document.getElementById('feedback');
const feedbackTitleEl = document.getElementById('feedbackTitle');
const feedbackMeaningEl = document.getElementById('feedbackMeaning');
const feedbackSynonymEl = document.getElementById('feedbackSynonym');
const continueBtn = document.getElementById('continueBtn');
const progressFill = document.getElementById('progressFill');
const scoreDisplay = document.getElementById('scoreDisplay');
const errorDisplay = document.getElementById('errorDisplay');

function initQuiz() {
  questions = shuffle(QUIZ_DATA);
  currentIndex = 0;
  correctCount = 0;
  wrongCount = 0;
  wrongAnswers = [];
  quizScreen.style.display = 'block';
  resultScreen.classList.remove('show');
  renderQuestion();
}

function renderQuestion() {
  answered = false;
  const item = questions[currentIndex];
  qnumEl.textContent = `Câu ${currentIndex + 1} / ${questions.length}`;
  questionTextEl.textContent = item.q;
  progressFill.style.width = `${(currentIndex / questions.length) * 100}%`;
  scoreDisplay.textContent = `✓ ${correctCount}`;
  errorDisplay.textContent = `✗ ${wrongCount}`;

  optionsContainer.innerHTML = '';
  const letters = ['A', 'B', 'C', 'D'];
  item.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerHTML = `<span class="letter">${letters[i]}</span><span>${opt}</span>`;
    btn.addEventListener('click', () => selectOption(i));
    optionsContainer.appendChild(btn);
  });

  feedbackEl.className = 'feedback';
  continueBtn.classList.remove('show');
}

function selectOption(i) {
  if (answered) return;
  answered = true;
  const item = questions[currentIndex];
  const buttons = optionsContainer.querySelectorAll('.option-btn');
  const isCorrect = i === item.correct;

  buttons.forEach((btn, idx) => {
    btn.disabled = true;
    if (idx === item.correct) {
      btn.classList.add('correct');
    } else if (idx === i && !isCorrect) {
      btn.classList.add('wrong');
    } else {
      btn.classList.add('dim');
    }
  });

  if (isCorrect) {
    correctCount++;
    feedbackEl.className = 'feedback show correct-fb';
    feedbackTitleEl.textContent = 'Chính xác! 🎉';
  } else {
    wrongCount++;
    wrongAnswers.push({ q: item.q, answer: item.answerWord, meaning: item.meaning });
    feedbackEl.className = 'feedback show wrong-fb';
    feedbackTitleEl.textContent = `Sai rồi. Đáp án đúng: ${item.answerWord}`;
  }
  feedbackMeaningEl.innerHTML = `<b>Nghĩa:</b> ${item.meaning}`;
  feedbackSynonymEl.innerHTML = item.synonym ? `<b>Đồng nghĩa:</b> ${item.synonym}` : '';

  scoreDisplay.textContent = `✓ ${correctCount}`;
  errorDisplay.textContent = `✗ ${wrongCount}`;

  continueBtn.classList.add('show');
}

continueBtn.addEventListener('click', () => {
  currentIndex++;
  if (currentIndex >= questions.length) {
    showResults();
  } else {
    renderQuestion();
  }
});

function showResults() {
  quizScreen.style.display = 'none';
  resultScreen.classList.add('show');
  progressFill.style.width = '100%';
  document.getElementById('finalCorrect').textContent = correctCount;
  document.getElementById('finalWrong').textContent = wrongCount;

  const pct = Math.round((correctCount / questions.length) * 100);
  const emojiEl = document.getElementById('resultEmoji');
  const titleEl = document.getElementById('resultTitle');
  if (pct >= 90) { emojiEl.textContent = '🏆'; titleEl.textContent = 'Xuất sắc!'; }
  else if (pct >= 70) { emojiEl.textContent = '🎉'; titleEl.textContent = 'Rất tốt!'; }
  else if (pct >= 50) { emojiEl.textContent = '👍'; titleEl.textContent = 'Khá ổn!'; }
  else { emojiEl.textContent = '💪'; titleEl.textContent = 'Cần luyện thêm!'; }

  const wrongListEl = document.getElementById('wrongList');
  if (wrongAnswers.length === 0) {
    wrongListEl.innerHTML = '<p style="text-align:center;color:#999;">Không có câu sai nào — hoàn hảo!</p>';
  } else {
    wrongListEl.innerHTML = '<div style="font-weight:800;margin-bottom:10px;">Các câu đã sai:</div>' +
      wrongAnswers.map(w => `
        <div class="wrong-item">
          <div class="q-text">${w.q}</div>
          <div class="ans-text">${w.answer} <span style="color:#777;font-weight:400;">— ${w.meaning}</span></div>
        </div>
      `).join('');
  }
}

document.getElementById('restartBtn').addEventListener('click', initQuiz);

initQuiz();
</script>
