<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lexico Quiz – Động từ tiền tố tiếng Đức</title>
<style>
  :root {
    --green: #58cc02;
    --green-dark: #46a302;
    --red: #ff4b4b;
    --red-dark: #d63b3b;
    --blue: #1cb0f6;
    --blue-dark: #1899d6;
    --purple: #ce82ff;
    --purple-dark: #a568cc;
    --gray-bg: #f7f7f7;
    --gray-border: #e5e5e5;
    --text: #3c3c3c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--gray-bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 20px 12px 40px;
  }
  .app { width: 100%; max-width: 480px; }

  .topbar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  .progress-bar {
    flex: 1;
    height: 16px;
    background: var(--gray-border);
    border-radius: 999px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--green);
    border-radius: 999px;
    transition: width 0.3s ease;
    width: 0%;
  }
  .score { font-weight: 800; color: var(--green-dark); white-space: nowrap; font-size: 15px; }
  .errors { font-weight: 800; color: var(--red); white-space: nowrap; font-size: 15px; }

  .subbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    font-size: 12px;
    color: #999;
    font-weight: 700;
  }
  .mastered-badge { color: var(--purple-dark); }
  .mode-badge {
    background: #fff3d6;
    color: #b8860b;
    padding: 2px 8px;
    border-radius: 8px;
    font-size: 11px;
  }
  .review-wrong-btn, .resume-btn {
    border: none;
    border-radius: 999px;
    padding: 5px 12px;
    font-size: 12px;
    font-weight: 800;
    cursor: pointer;
    font-family: inherit;
  }
  .review-wrong-btn { background: #ffdfe0; color: var(--red-dark); }
  .resume-btn { background: #d7ffb8; color: var(--green-dark); }
  .review-wrong-btn:active, .resume-btn:active { transform: translateY(1px); }

  .card {
    background: white;
    border-radius: 16px;
    padding: 28px 20px;
    box-shadow: 0 2px 0 var(--gray-border);
    border: 2px solid var(--gray-border);
  }
  .qnum {
    font-size: 13px;
    color: #999;
    font-weight: 700;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
    text-transform: uppercase;
  }
  .question { font-size: 20px; font-weight: 700; line-height: 1.4; margin-bottom: 10px; }

  .translate-toggle {
    background: none;
    border: none;
    color: var(--blue);
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    padding: 0 0 16px 0;
    display: flex;
    align-items: center;
    gap: 4px;
    font-family: inherit;
  }
  .translate-toggle .arrow { transition: transform 0.15s ease; display: inline-block; }
  .translate-toggle.open .arrow { transform: rotate(180deg); }
  .translation-box {
    display: none;
    background: #f0faff;
    border: 2px solid var(--blue);
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 14px;
    color: var(--text);
    margin-bottom: 16px;
  }
  .translation-box.show { display: block; }

  .options { display: flex; flex-direction: column; gap: 12px; }
  .option-btn {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    text-align: left;
    padding: 14px 16px;
    font-size: 17px;
    font-weight: 600;
    border-radius: 14px;
    border: 2px solid var(--gray-border);
    border-bottom-width: 5px;
    background: white;
    color: var(--text);
    cursor: pointer;
    transition: transform 0.05s ease, background 0.15s ease, border-color 0.15s ease;
    font-family: inherit;
  }
  .option-btn .letter {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 2px solid var(--gray-border);
    font-size: 13px;
    font-weight: 800;
    color: #999;
    flex-shrink: 0;
  }
  .option-btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 3px; }
  .option-btn:hover:not(:disabled) { background: #f0faff; border-color: var(--blue); }
  .option-btn:disabled { cursor: default; }
  .option-btn.correct { background: #d7ffb8; border-color: var(--green); color: var(--green-dark); }
  .option-btn.correct .letter { background: var(--green); border-color: var(--green); color: white; }
  .option-btn.wrong { background: #ffdfe0; border-color: var(--red); color: var(--red-dark); }
  .option-btn.wrong .letter { background: var(--red); border-color: var(--red); color: white; }
  .option-btn.dim { opacity: 0.5; }

  .feedback {
    margin-top: 20px;
    padding: 16px 18px;
    border-radius: 14px;
    display: none;
    animation: slideUp 0.2s ease;
  }
  @keyframes slideUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .feedback.show { display: block; }
  .feedback.correct-fb { background: #d7ffb8; border: 2px solid var(--green); }
  .feedback.wrong-fb { background: #ffdfe0; border: 2px solid var(--red); }
  .feedback-title { font-weight: 800; font-size: 15px; margin-bottom: 6px; }
  .correct-fb .feedback-title { color: var(--green-dark); }
  .wrong-fb .feedback-title { color: var(--red-dark); }
  .feedback-line { font-size: 14px; color: var(--text); margin-top: 3px; }
  .feedback-line b { color: inherit; }

  .nav-row { display: flex; gap: 10px; margin-top: 20px; }
  .back-btn {
    flex: 0 0 auto;
    padding: 16px 18px;
    font-size: 15px;
    font-weight: 800;
    border-radius: 14px;
    border: 2px solid var(--gray-border);
    border-bottom-width: 5px;
    background: white;
    color: #777;
    cursor: pointer;
    font-family: inherit;
    display: none;
  }
  .back-btn.show { display: block; }
  .back-btn:active { transform: translateY(2px); border-bottom-width: 3px; }
  .continue-btn {
    flex: 1;
    padding: 16px;
    font-size: 16px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    border-radius: 14px;
    border: none;
    border-bottom: 5px solid var(--green-dark);
    background: var(--green);
    color: white;
    cursor: pointer;
    display: none;
    font-family: inherit;
  }
  .continue-btn.show { display: block; }
  .continue-btn:active { transform: translateY(2px); border-bottom-width: 3px; }

  .result-screen { display: none; text-align: center; padding: 40px 20px; }
  .result-screen.show { display: block; }
  .result-emoji { font-size: 64px; margin-bottom: 12px; }
  .result-title { font-size: 24px; font-weight: 800; margin-bottom: 8px; }
  .result-stats { display: flex; justify-content: center; gap: 16px; margin: 24px 0; flex-wrap: wrap; }
  .stat-box { background: white; border: 2px solid var(--gray-border); border-radius: 14px; padding: 14px 20px; }
  .stat-num { font-size: 26px; font-weight: 800; }
  .stat-label { font-size: 12px; color: #999; font-weight: 700; text-transform: uppercase; }
  .stat-box.correct-stat .stat-num { color: var(--green-dark); }
  .stat-box.wrong-stat .stat-num { color: var(--red); }
  .stat-box.mastered-stat .stat-num { color: var(--purple-dark); }

  .result-buttons { display: flex; flex-direction: column; gap: 12px; align-items: center; }
  .restart-btn, .retry-wrong-btn {
    padding: 16px 32px;
    font-size: 15px;
    font-weight: 800;
    text-transform: uppercase;
    border-radius: 14px;
    border: none;
    cursor: pointer;
    font-family: inherit;
    width: 100%;
    max-width: 320px;
  }
  .restart-btn { border-bottom: 5px solid var(--blue-dark); background: var(--blue); color: white; }
  .retry-wrong-btn { border-bottom: 5px solid var(--red-dark); background: var(--red); color: white; }
  .retry-wrong-btn:disabled { background: #ccc; border-bottom-color: #999; cursor: not-allowed; }
  .restart-btn:active, .retry-wrong-btn:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 3px; }

  .wrong-list {
    text-align: left;
    margin-top: 24px;
    max-height: 260px;
    overflow-y: auto;
    border-top: 2px solid var(--gray-border);
    padding-top: 16px;
  }
  .wrong-item { background: white; border: 2px solid var(--gray-border); border-radius: 12px; padding: 10px 14px; margin-bottom: 8px; font-size: 14px; }
  .wrong-item .q-text { color: #777; margin-bottom: 4px; }
  .wrong-item .ans-text { font-weight: 700; color: var(--green-dark); }

  #quiz-screen { display: block; }
</style>
</head>
<body>
<div class="app">

  <div id="quiz-screen">
    <div class="topbar">
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <div class="score" id="scoreDisplay">✓ 0</div>
      <div class="errors" id="errorDisplay">✗ 0</div>
    </div>
    <div class="subbar">
      <span class="mastered-badge" id="masteredBadge">Đã thuộc: 0/311</span>
      <button class="review-wrong-btn" id="reviewWrongBtn" style="display:none;">🔁 Ôn câu sai (<span id="wrongPoolCount">0</span>)</button>
      <button class="resume-btn" id="resumeBtn" style="display:none;">↩ Quay lại bài đang làm</button>
    </div>

    <div class="card">
      <div class="qnum" id="qnum">Câu 1 / 311</div>
      <div class="question" id="questionText"></div>

      <button class="translate-toggle" id="translateToggle">
        <span class="arrow">▾</span> Xem nghĩa câu
      </button>
      <div class="translation-box" id="translationBox"></div>

      <div class="options" id="optionsContainer"></div>

      <div class="feedback" id="feedback">
        <div class="feedback-title" id="feedbackTitle"></div>
        <div class="feedback-line" id="feedbackMeaning"></div>
        <div class="feedback-line" id="feedbackSynonym"></div>
        <div class="feedback-line" id="feedbackAntonym"></div>
      </div>

      <div class="nav-row">
        <button class="back-btn" id="backBtn">← Câu trước</button>
        <button class="continue-btn" id="continueBtn">Tiếp tục</button>
      </div>
    </div>
  </div>

  <div id="result-screen" class="result-screen">
    <div class="result-emoji" id="resultEmoji">🎉</div>
    <div class="result-title" id="resultTitle">Hoàn thành!</div>
    <div class="result-stats">
      <div class="stat-box correct-stat">
        <div class="stat-num" id="finalCorrect">0</div>
        <div class="stat-label">Đúng</div>
      </div>
      <div class="stat-box wrong-stat">
        <div class="stat-num" id="finalWrong">0</div>
        <div class="stat-label">Sai</div>
      </div>
      <div class="stat-box mastered-stat">
        <div class="stat-num" id="finalMastered">0</div>
        <div class="stat-label">Đã thuộc</div>
      </div>
    </div>
    <div class="result-buttons">
      <button class="retry-wrong-btn" id="retryWrongBtn">Làm lại các câu sai</button>
      <button class="restart-btn" id="restartBtn">Làm lại toàn bộ 311 câu</button>
    </div>
    <div class="wrong-list" id="wrongList"></div>
  </div>

</div>

<script>
const QUIZ_DATA = [{"q": "Der Komiker hat das Publikum gut ______.", "options": ["behalten", "unterhalten", "abgehalten", "aufgehalten"], "correct": 1, "meaning": "giải trí; trò chuyện", "answerWord": "unterhalten", "synonym": "amüsieren", "translation": "Diễn viên hài đã làm khán giả rất vui.", "antonym": "gelangweilt (làm cho chán)"}, {"q": "Wir sind an der nächsten Station ______.", "options": ["umgestiegen", "abgestiegen", "aufgestiegen", "ausgestiegen"], "correct": 3, "meaning": "xuống xe; rút lui", "answerWord": "ausgestiegen", "synonym": "verlassen", "translation": "Chúng tôi đã xuống xe ở trạm tiếp theo.", "antonym": "eingestiegen (lên xe)"}, {"q": "Der Sänger hat ein neues Album ______.", "options": ["aufgenommen", "angenommen", "eingenommen", "benommen"], "correct": 0, "meaning": "thu nhận; ghi âm", "answerWord": "aufgenommen", "synonym": "aufzeichnen", "translation": "Ca sĩ đã thu âm một album mới.", "antonym": ""}, {"q": "Ich habe mein Handy beim Kundendienst ______.", "options": ["vergeben", "abgegeben", "zugegeben", "eingegeben"], "correct": 1, "meaning": "nộp lại; giao", "answerWord": "abgegeben", "synonym": "übergeben", "translation": "Tôi đã nộp điện thoại tại trung tâm bảo hành.", "antonym": "abgeholt (lấy về)"}, {"q": "Der Himmel war heute völlig ______.", "options": ["bedeckt", "zugedeckt", "entdeckt", "abgedeckt"], "correct": 0, "meaning": "che phủ", "answerWord": "bedeckt", "synonym": "verhüllen", "translation": "Hôm nay bầu trời hoàn toàn bị mây che phủ.", "antonym": ""}, {"q": "Sie hat ihre Meinung klar ______.", "options": ["ausgesprochen", "abgesprochen", "versprochen", "besprochen"], "correct": 0, "meaning": "phát âm; bày tỏ", "answerWord": "ausgesprochen", "synonym": "äußern", "translation": "Cô ấy đã bày tỏ quan điểm của mình rõ ràng.", "antonym": "verschwiegen (giấu kín)"}, {"q": "Der Minister ist wegen des Skandals ______.", "options": ["zurückgetreten", "angetreten", "eingetreten", "aufgetreten"], "correct": 0, "meaning": "từ chức; lùi lại", "answerWord": "zurückgetreten", "synonym": "kündigen", "translation": "Bộ trưởng đã từ chức vì vụ bê bối.", "antonym": "angetreten (nhậm chức)"}, {"q": "Der Zug ist schon ______.", "options": ["abgefahren", "befahren", "weggefahren", "mitgefahren"], "correct": 0, "meaning": "khởi hành", "answerWord": "abgefahren", "synonym": "losfahren", "translation": "Tàu đã khởi hành rồi.", "antonym": "angekommen (đến nơi)"}, {"q": "Er hat bei dem Streit einfach ______.", "options": ["verändert", "weggeschaut", "zugeschaut", "angeschaut"], "correct": 1, "meaning": "quay đi không nhìn", "answerWord": "weggeschaut", "synonym": "ignorieren", "translation": "Anh ấy chỉ đơn giản là quay đi khi có cuộc cãi vã.", "antonym": "hingeschaut (nhìn thẳng vào)"}, {"q": "Die Pflanze ist von Schädlingen ______.", "options": ["ausgefallen", "befallen", "weggefallen", "verfallen"], "correct": 1, "meaning": "xâm nhập (bệnh, sâu bọ)", "answerWord": "befallen", "synonym": "heimsuchen", "translation": "Cây đã bị sâu bệnh tấn công.", "antonym": ""}, {"q": "Wir haben eine halbe Stunde an der Kasse ______.", "options": ["aufgestanden", "bestanden", "angestanden", "verstanden"], "correct": 2, "meaning": "xếp hàng", "answerWord": "angestanden", "synonym": "Schlange stehen", "translation": "Chúng tôi đã xếp hàng nửa tiếng ở quầy thu ngân.", "antonym": ""}, {"q": "Das Problem hat mich persönlich sehr ______.", "options": ["angegangen", "eingegangen", "begangen", "zugegangen"], "correct": 0, "meaning": "liên quan đến; bắt đầu", "answerWord": "angegangen", "synonym": "betreffen", "translation": "Vấn đề này liên quan sâu sắc đến cá nhân tôi.", "antonym": ""}, {"q": "Nach der Krankheit hat er sich gut ______.", "options": ["abgehalten", "abgeholt", "erholt", "eingeholt"], "correct": 2, "meaning": "nghỉ ngơi, hồi phục", "answerWord": "erholt", "synonym": "sich ausruhen", "translation": "Sau khi ốm, anh ấy đã hồi phục tốt.", "antonym": "verschlechtert (trở nên tệ hơn)"}, {"q": "Die Feier wurde perfekt ____ , "options": ["überwacht", "aufgewachsen", "bewacht", "erwacht"], "correct": 1, "meaning": "lớn lên", "answerWord": "aufgewachsen", "synonym": "groß werden", "translation": "Anh ấy đã lớn lên ở vùng nông thôn.", "antonym": ""}, {"q": "Die Tür ist von selbst ______.", "options": ["aufgegangen", "ausgegangen", "weggegangen", "zugegangen"], "correct": 3, "meaning": "đóng lại; tiến đến", "answerWord": "zugegangen", "synonym": "sich nähern", "translation": "Cánh cửa tự đóng lại.", "antonym": "aufgegangen (mở ra)"}, {"q": "Wir haben uns in der fremden Stadt ______.", "options": ["ausgefahren", "verfahren", "eingefahren", "mitgefahren"], "correct": 1, "meaning": "đi lạc đường", "answerWord": "verfahren", "synonym": "sich verirren", "translation": "Chúng tôi đã bị lạc đường ở thành phố xa lạ.", "antonym": ""}, {"q": "Plötzlich ist ein technisches Problem ______.", "options": ["eingetreten", "betreten", "übertreten", "angetreten"], "correct": 0, "meaning": "bước vào; xảy ra", "answerWord": "eingetreten", "synonym": "hineingehen", "translation": "Đột nhiên một sự cố kỹ thuật đã xảy ra.", "antonym": ""}, {"q": "Der Zettel wurde ans Brett ______.", "options": ["abgeschlagen", "aufgeschlagen", "vorgeschlagen", "angeschlagen"], "correct": 3, "meaning": "dán thông báo; va vào", "answerWord": "angeschlagen", "synonym": "befestigen", "translation": "Tờ giấy đã được dán lên bảng thông báo.", "antonym": ""}, {"q": "Er hat sich in der Diskussion ruhig ______.", "options": ["aufgehalten", "festgehalten", "abgehalten", "verhalten"], "correct": 3, "meaning": "cư xử", "answerWord": "verhalten", "synonym": "sich benehmen", "translation": "Anh ấy đã cư xử điềm tĩnh trong cuộc tranh luận.", "antonym": ""}, {"q": "Er hat sich in der Prüfung merkwürdig ______.", "options": ["eingenommen", "benommen", "weggenommen", "vernommen"], "correct": 1, "meaning": "cư xử", "answerWord": "benommen", "synonym": "sich verhalten", "translation": "Anh ấy đã cư xử kỳ lạ trong kỳ thi.", "antonym": ""}]
;

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// session-persistent state (resets only on page reload)
let masteredSet = new Set(); // question text -> mastered (answered correctly at least once this session)

let questions = [];
let currentIndex = 0;
let correctCount = 0;
let wrongCount = 0;
let wrongAnswers = [];      // this round's wrong items (full item objects)
let answeredState = [];     // per-question: null | {selectedIndex, isCorrect}
let currentMode = 'all';    // 'all' | 'wrong' | 'wrongReview'
let wrongPool = new Map();  // session-wide: q text -> item, currently-unmastered wrong answers
let savedState = null;      // holds paused main-quiz state while doing a mid-quiz wrong review

const quizScreen = document.getElementById('quiz-screen');
const resultScreen = document.getElementById('result-screen');
const qnumEl = document.getElementById('qnum');
const questionTextEl = document.getElementById('questionText');
const optionsContainer = document.getElementById('optionsContainer');
const feedbackEl = document.getElementById('feedback');
const feedbackTitleEl = document.getElementById('feedbackTitle');
const feedbackMeaningEl = document.getElementById('feedbackMeaning');
const feedbackSynonymEl = document.getElementById('feedbackSynonym');
const feedbackAntonymEl = document.getElementById('feedbackAntonym');
const continueBtn = document.getElementById('continueBtn');
const backBtn = document.getElementById('backBtn');
const progressFill = document.getElementById('progressFill');
const scoreDisplay = document.getElementById('scoreDisplay');
const errorDisplay = document.getElementById('errorDisplay');
const masteredBadge = document.getElementById('masteredBadge');
const reviewWrongBtn = document.getElementById('reviewWrongBtn');
const wrongPoolCountEl = document.getElementById('wrongPoolCount');
const resumeBtn = document.getElementById('resumeBtn');
const translateToggle = document.getElementById('translateToggle');
const translationBox = document.getElementById('translationBox');

function startQuiz(pool, mode) {
  questions = shuffle(pool);
  currentIndex = 0;
  correctCount = 0;
  wrongCount = 0;
  wrongAnswers = [];
  answeredState = new Array(questions.length).fill(null);
  currentMode = mode;
  quizScreen.style.display = 'block';
  resultScreen.classList.remove('show');
  renderQuestion();
}

function initQuiz() {
  startQuiz(QUIZ_DATA, 'all');
}

// --- Pause main quiz -> review wrong questions -> resume ---
function startWrongReview() {
  if (wrongPool.size === 0) return;
  savedState = {
    questions, currentIndex, correctCount, wrongCount,
    answeredState, wrongAnswers, mode: currentMode
  };
  const pool = Array.from(wrongPool.values());
  startQuiz(pool, 'wrongReview');
}

function resumeMainQuiz() {
  if (!savedState) return;
  ({ questions, currentIndex, correctCount, wrongCount, answeredState, wrongAnswers } = savedState);
  currentMode = savedState.mode;
  savedState = null;
  quizScreen.style.display = 'block';
  resultScreen.classList.remove('show');
  renderQuestion();
}

reviewWrongBtn.addEventListener('click', startWrongReview);
resumeBtn.addEventListener('click', resumeMainQuiz);

function updateTopbar() {
  progressFill.style.width = `${(currentIndex / questions.length) * 100}%`;
  scoreDisplay.textContent = `✓ ${correctCount}`;
  errorDisplay.textContent = `✗ ${wrongCount}`;
  masteredBadge.textContent = `Đã thuộc: ${masteredSet.size}/${QUIZ_DATA.length}`;

  const inReview = currentMode === 'wrongReview';
  resumeBtn.style.display = inReview ? 'inline-block' : 'none';
  reviewWrongBtn.style.display = (!inReview && wrongPool.size > 0) ? 'inline-block' : 'none';
  wrongPoolCountEl.textContent = wrongPool.size;
}

function renderQuestion() {
  const item = questions[currentIndex];
  qnumEl.textContent = `Câu ${currentIndex + 1} / ${questions.length}`;
  questionTextEl.textContent = item.q;
  updateTopbar();

  translationBox.classList.remove('show');
  translationBox.textContent = item.translation || '';
  translateToggle.classList.remove('open');

  optionsContainer.innerHTML = '';
  const letters = ['A', 'B', 'C', 'D'];
  const state = answeredState[currentIndex];

  item.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerHTML = `<span class="letter">${letters[i]}</span><span>${opt}</span>`;
    if (!state) {
      btn.addEventListener('click', () => selectOption(i));
    } else {
      btn.disabled = true;
      if (i === item.correct) btn.classList.add('correct');
      else if (i === state.selectedIndex && !state.isCorrect) btn.classList.add('wrong');
      else btn.classList.add('dim');
    }
    optionsContainer.appendChild(btn);
  });

  if (state) {
    showFeedback(item, state.isCorrect);
    continueBtn.classList.add('show');
    continueBtn.textContent = currentIndex === questions.length - 1 ? 'Xem kết quả' : 'Tiếp tục';
  } else {
    feedbackEl.className = 'feedback';
    continueBtn.classList.remove('show');
  }

  backBtn.classList.toggle('show', currentIndex > 0);
}

function showFeedback(item, isCorrect) {
  if (isCorrect) {
    feedbackEl.className = 'feedback show correct-fb';
    feedbackTitleEl.textContent = 'Chính xác! 🎉';
  } else {
    feedbackEl.className = 'feedback show wrong-fb';
    feedbackTitleEl.textContent = `Sai rồi. Đáp án đúng: ${item.answerWord}`;
  }
  feedbackMeaningEl.innerHTML = `<b>Nghĩa:</b> ${item.meaning}`;
  feedbackSynonymEl.innerHTML = item.synonym ? `<b>Đồng nghĩa:</b> ${item.synonym}` : '';
  feedbackAntonymEl.innerHTML = item.antonym ? `<b>Trái nghĩa:</b> ${item.antonym}` : '';
}

function selectOption(i) {
  if (answeredState[currentIndex]) return;
  const item = questions[currentIndex];
  const isCorrect = i === item.correct;
  answeredState[currentIndex] = { selectedIndex: i, isCorrect };

  const buttons = optionsContainer.querySelectorAll('.option-btn');
  buttons.forEach((btn, idx) => {
    btn.disabled = true;
    if (idx === item.correct) btn.classList.add('correct');
    else if (idx === i && !isCorrect) btn.classList.add('wrong');
    else btn.classList.add('dim');
  });

  if (isCorrect) {
    correctCount++;
    masteredSet.add(item.q);
  } else {
    wrongCount++;
    wrongAnswers.push(item);
    masteredSet.delete(item.q);
  }

  showFeedback(item, isCorrect);
  updateTopbar();

  continueBtn.classList.add('show');
  continueBtn.textContent = currentIndex === questions.length - 1 ? 'Xem kết quả' : 'Tiếp tục';
}

translateToggle.addEventListener('click', () => {
  translationBox.classList.toggle('show');
  translateToggle.classList.toggle('open');
});

backBtn.addEventListener('click', () => {
  if (currentIndex > 0) {
    currentIndex--;
    renderQuestion();
  }
});

continueBtn.addEventListener('click', () => {
  if (!answeredState[currentIndex]) return;
  currentIndex++;
  if (currentIndex >= questions.length) {
    showResults();
  } else {
    renderQuestion();
  }
});

function showResults() {
  quizScreen.style.display = 'none';
  resultScreen.classList.add('show');
  progressFill.style.width = '100%';
  document.getElementById('finalCorrect').textContent = correctCount;
  document.getElementById('finalWrong').textContent = wrongCount;
  document.getElementById('finalMastered').textContent = `${masteredSet.size}/${QUIZ_DATA.length}`;

  const pct = Math.round((correctCount / questions.length) * 100);
  const emojiEl = document.getElementById('resultEmoji');
  const titleEl = document.getElementById('resultTitle');
  if (pct >= 90) { emojiEl.textContent = '🏆'; titleEl.textContent = 'Xuất sắc!'; }
  else if (pct >= 70) { emojiEl.textContent = '🎉'; titleEl.textContent = 'Rất tốt!'; }
  else if (pct >= 50) { emojiEl.textContent = '👍'; titleEl.textContent = 'Khá ổn!'; }
  else { emojiEl.textContent = '💪'; titleEl.textContent = 'Cần luyện thêm!'; }

  const retryBtn = document.getElementById('retryWrongBtn');
  if (wrongAnswers.length === 0) {
    retryBtn.disabled = true;
    retryBtn.textContent = 'Không có câu sai để ôn 🎉';
  } else {
    retryBtn.disabled = false;
    retryBtn.textContent = `Làm lại ${wrongAnswers.length} câu sai`;
  }

  const wrongListEl = document.getElementById('wrongList');
  if (wrongAnswers.length === 0) {
    wrongListEl.innerHTML = '<p style="text-align:center;color:#999;">Không có câu sai nào — hoàn hảo!</p>';
  } else {
    wrongListEl.innerHTML = '<div style="font-weight:800;margin-bottom:10px;">Các câu đã sai:</div>' +
      wrongAnswers.map(w => `
        <div class="wrong-item">
          <div class="q-text">${w.q}</div>
          <div class="ans-text">${w.answerWord} <span style="color:#777;font-weight:400;">— ${w.meaning}</span></div>
        </div>
      `).join('');
  }
}

document.getElementById('restartBtn').addEventListener('click', () => startQuiz(QUIZ_DATA, 'all'));
document.getElementById('retryWrongBtn').addEventListener('click', () => {
  if (wrongAnswers.length > 0) startQuiz(wrongAnswers, 'wrong');
});

initQuiz();
</script>
